name: Smoke Test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check
        run: sh -n mkwork.sh

      - name: Smoke test
        run: |
          set -eu
          tmp_dir="$(mktemp -d)"
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME"
          . ./mkwork.sh
          mkwork --version
          mkwork --doctor
          mkwork testdir
          test -d "$HOME/work/$(date +%Y%m%d)_testdir"

          mkwork --install --repo book000/mkwork
          test -f "$HOME/.local/share/mkwork/mkwork.sh"
          grep -q '^repo=book000/mkwork$' "$HOME/.config/mkwork/config"
          mkwork --uninstall
          test ! -f "$HOME/.local/share/mkwork/mkwork.sh"

      - name: Smoke test (error cases)
        run: |
          set -eu
          tmp_dir="$(mktemp -d)"
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME"
          . ./mkwork.sh

          ! mkwork --unknown 2>/dev/null
          ! mkwork foo --unknown 2>/dev/null
          test ! -d "$HOME/work/$(date +%Y%m%d)_foo"
          ! mkwork -bar 2>/dev/null
          ! mkwork -- -bar 2>/dev/null
          ! mkwork --update extra 2>/dev/null
          ! mkwork --doctor extra 2>/dev/null
          ! mkwork --uninstall extra 2>/dev/null
          ! mkwork --version extra 2>/dev/null
          ! mkwork --help extra 2>/dev/null
          ! mkwork --select extra 2>/dev/null
          ! mkwork --install --repo 2>/dev/null
          ! mkwork --install --unknown 2>/dev/null
          ! mkwork --install bogusarg 2>/dev/null
          ! mkwork --install --repo not-a-valid-repo 2>/dev/null

          mkwork --version
          mkwork --doctor
