name: Smoke Test

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell syntax check
        run: sh -n mkwork.sh

      - name: Validate release artifacts
        run: |
          set -eu
          script="$(pwd)/scripts/prepare-release.sh"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          cp mkwork.sh "$tmp_dir/mkwork.sh"
          cd "$tmp_dir"
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME"
          for tag in v1.2.3 v1.2.3-rc.1+build.5 2026.11_a; do
            rm -rf dist
            sh "$script" "$tag"
            grep -qxF "MKWORK_VERSION=\"$tag\"  # replaced by release workflow" dist/mkwork.sh
            (cd dist && sha256sum -c mkwork.sh.sha256)
            test "$(sh -c '. ./dist/mkwork.sh; mkwork --version')" = "mkwork $tag"
          done
          rm -rf dist
          for tag in '' 'v1/2' 'v1&x' 'v1"x' 'v1\x' 'v1 x' 'v1$(touch injected)' 'v1`touch injected`' "$(printf 'v1\nx')"; do
            if sh "$script" "$tag"; then
              echo "accepted unsafe tag: $tag" >&2
              exit 1
            fi
            test ! -e dist
            test ! -e injected
          done

      - name: Smoke test
        run: |
          set -eu
          repo_root="$(pwd)"
          tmp_dir="$(mktemp -d)"
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME"
          . ./mkwork.sh
          mkwork --version
          mkwork --doctor
          mkwork testdir
          test -d "$HOME/work/$(date +%Y%m%d)_testdir"

          # Management commands must keep working for a standalone install
          mkwork --install --repo book000/mkwork
          test -f "$HOME/.local/share/mkwork/mkwork.sh"
          grep -q '^repo=book000/mkwork$' "$HOME/.config/mkwork/config"
          mkwork --uninstall
          test ! -f "$HOME/.local/share/mkwork/mkwork.sh"

          # mise-managed scenario: mimic the bootstrap through the real bash alias/unalias mechanism.
          # Without going through bash alias expansion, a bug in the README bootstrap order would go undetected.
          bash -c '
            set -eu
            shopt -s expand_aliases
            mkwork_sh_path="'"$repo_root"'/mkwork.sh"
            tmp_dir_mise="$(mktemp -d)"
            export HOME="$tmp_dir_mise/home"
            mkdir -p "$HOME"
            alias mkwork="unalias mkwork; export MKWORK_INSTALL_METHOD=mise; . \"$mkwork_sh_path\"; unset MKWORK_INSTALL_METHOD; mkwork"
            mkwork testdir2
            [ -d "$HOME/work/$(date +%Y%m%d)_testdir2" ]
            [ "$MKWORK_MANAGED_BY" = "mise" ]
            mkwork --doctor | grep -q "managed_by: mise"
            ! mkwork --install 2>/tmp/mise-install.err
            grep -q "managed by mise" /tmp/mise-install.err
            ! mkwork --update 2>/tmp/mise-update.err
            grep -q "managed by mise" /tmp/mise-update.err
            ! mkwork --uninstall 2>/tmp/mise-uninstall.err
            grep -q "managed by mise" /tmp/mise-uninstall.err
            [ ! -f "$HOME/.local/state/mkwork/state.json" ]
          '

      - name: Expand configured work roots
        run: |
          set -eu
          sudo apt-get update && sudo apt-get install -y zsh
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          export HOME="$tmp_dir/home"
          export MKWORK_TEST_SCRIPT="$(pwd)/mkwork.sh"
          mkdir -p "$HOME/.config/mkwork" "$tmp_dir/start"
          cat > "$tmp_dir/test.sh" <<'EOF'
          set -eu
          . "$MKWORK_TEST_SCRIPT"
          mkwork__config_paths() { printf '%s\n' "$HOME/.config/mkwork/config"; }
          test "$(mkwork__path_home_expand '~')" = "$HOME"
          test "$(mkwork__path_home_expand '~/work space')" = "$HOME/work space"
          test "$(mkwork__path_home_expand "$HOME/work")" = "$HOME/work"
          test "$(mkwork__path_home_expand '~other/work')" = '~other/work'
          printf 'work_root=~/work space\nupdate_check=0\n' > "$HOME/.config/mkwork/config"
          mkwork example
          test "$PWD" = "$HOME/work space/$(date +%Y%m%d)_example"
          EOF
          for shell in bash dash zsh; do
            (cd "$tmp_dir/start" && "$shell" "$tmp_dir/test.sh")
          done
          test ! -d "$tmp_dir/start/~"

      - name: Select only dated directories
        run: |
          set -eu
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          export HOME="$tmp_dir/home" MKWORK_TEST_SCRIPT="$(pwd)/mkwork.sh"
          mkdir -p "$HOME/work"
          cat > "$tmp_dir/test.sh" <<'EOF'
          set -eu
          . "$MKWORK_TEST_SCRIPT"
          MKWORK_WORK_ROOT="$HOME/work"
          ! mkwork__list_dirs > "$HOME/out" 2> "$HOME/err"
          test ! -s "$HOME/out"
          test "$(cat "$HOME/err")" = 'mkwork: no directories found'
          touch "$HOME/work/20200101_note" "$HOME/work/20270101_file"
          ! mkwork__list_dirs > "$HOME/out" 2> "$HOME/err"
          test "$(cat "$HOME/err")" = 'mkwork: no directories found'
          mkdir "$HOME/work/20260101_project" "$HOME/work/20250101_other"
          expected="$(printf '%s\n%s' "$HOME/work/20260101_project" "$HOME/work/20250101_other")"
          test "$(mkwork__list_dirs)" = "$expected"
          test "$(printf '1\n' | mkwork__select_with_number 2> "$HOME/menu")" = "$HOME/work/20260101_project"
          ! grep -q '20270101_file\|20200101_note' "$HOME/menu"
          rm -r "$HOME/work"
          mkdir "$HOME/work"
          EOF
          for shell in bash dash zsh; do
            "$shell" "$tmp_dir/test.sh"
          done

      - name: Preserve caller variables
        run: |
          set -eu
          tmp_dir="$(mktemp -d)"
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME/.config/mkwork"
          printf 'update_check=0\n' > "$HOME/.config/mkwork/config"
          name=caller_name dir=caller_dir cfg=caller_cfg repo=caller_repo
          unset key line target repo_override
          . ./mkwork.sh
          mkwork --doctor >/dev/null
          mkwork --install --repo invalid >/dev/null 2>&1 || :
          mkwork example
          test "$PWD" = "$HOME/work/$(date +%Y%m%d)_example"
          test "$name:$dir:$cfg:$repo" = caller_name:caller_dir:caller_cfg:caller_repo
          test "${key+x}${line+x}${target+x}${repo_override+x}" = ""

      - name: Auto-update dispatch
        run: |
          set -eu
          tmp_dir="$(mktemp -d)"
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME/.config/mkwork" "$HOME/.local/share/mkwork" "$tmp_dir/bin" "$tmp_dir/release"
          printf 'MKWORK_VERSION="vTEST"\n' > "$tmp_dir/release/mkwork.sh"
          (cd "$tmp_dir/release" && sha256sum mkwork.sh > mkwork.sh.sha256)
          cat > "$tmp_dir/bin/curl" <<EOF
          #!/bin/sh
          for url; do :; done
          case "\$url" in
            */releases/latest) printf '{"tag_name":"vTEST"}\n' ;;
            */releases/download/vTEST/*) cat "$tmp_dir/release/\${url##*/}" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod +x "$tmp_dir/bin/curl"
          export PATH="$tmp_dir/bin:$PATH"
          installed="$HOME/.local/share/mkwork/mkwork.sh"
          state="$HOME/.local/state/mkwork/state.json"
          today="$(date +%Y%m%d)"

          # auto_update=1: the nested call must be --update, not a work name
          printf 'auto_update=1\n' > "$HOME/.config/mkwork/config"
          printf 'placeholder\n' > "$installed"
          timeout -k 2 20 sh -c '. ./mkwork.sh; mkwork autoupd'
          test -d "$HOME/work/${today}_autoupd"
          test ! -d "$HOME/work/${today}_update"
          cmp "$installed" "$tmp_dir/release/mkwork.sh"
          grep -q '"last_auto_update_attempt": "[^"]' "$state"

          # auto_update=0: the notification names a command that exists, and nothing is installed
          rm -f "$state"
          printf 'auto_update=0\n' > "$HOME/.config/mkwork/config"
          printf 'placeholder\n' > "$installed"
          current="$(sh -c '. ./mkwork.sh; printf %s "$MKWORK_VERSION"')"
          sh -c '. ./mkwork.sh; mkwork__maybe_check_update' 2> "$tmp_dir/notify.err"
          test "$(cat "$tmp_dir/notify.err")" = "mkwork: update available ($current -> vTEST). Run: mkwork --update"
          test "$(cat "$installed")" = placeholder
          grep -q '"last_auto_update_attempt": ""' "$state"

      - name: Smoke test (error cases)
        run: |
          set -eu
          tmp_dir="$(mktemp -d)"
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME"
          . ./mkwork.sh

          ! mkwork --unknown 2>/dev/null
          ! mkwork foo --unknown 2>/dev/null
          test ! -d "$HOME/work/$(date +%Y%m%d)_foo"
          ! mkwork -bar 2>/dev/null
          ! mkwork -- -bar 2>/dev/null
          ! mkwork --update extra 2>/dev/null
          ! mkwork --doctor extra 2>/dev/null
          ! mkwork --uninstall extra 2>/dev/null
          ! mkwork --version extra 2>/dev/null
          ! mkwork --help extra 2>/dev/null
          ! mkwork --select extra 2>/dev/null
          ! mkwork --install --repo 2>/dev/null
          ! mkwork --install --unknown 2>/dev/null
          ! mkwork --install bogusarg 2>/dev/null
          ! mkwork --install --repo not-a-valid-repo 2>/dev/null

          mkwork --version
          mkwork --doctor

      - name: Smoke test (nounset)
        run: |
          set -eu
          tmp_dir="$(mktemp -d)"
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME"
          # No-argument call must print usage and fail cleanly, not abort with an unbound variable
          rc=0
          bash -u -c '. ./mkwork.sh; mkwork' >"$tmp_dir/out" 2>"$tmp_dir/err" || rc=$?
          test "$rc" -eq 1
          grep -q 'unbound variable' "$tmp_dir/err" && exit 1
          grep -q '^Usage:' "$tmp_dir/err" "$tmp_dir/out"

      - name: Update check timeouts
        run: |
          set -eu
          tmp_dir="$(mktemp -d)"
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME" "$tmp_dir/bin" "$tmp_dir/out"
          export PATH="$tmp_dir/bin:$PATH"
          export CURL_ARGS="$tmp_dir/curl.args" CURL_COUNT="$tmp_dir/curl.count"

          # Stub curl records its arguments; flags must reach curl and the tag lookup must override the default total timeout
          cat > "$tmp_dir/bin/curl" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$*" >> "$CURL_ARGS"
          for url; do :; done
          case "$url" in
            */releases/latest) printf '{"tag_name":"vTEST"}\n' ;;
            *) printf 'x\n' ;;
          esac
          EOF
          chmod +x "$tmp_dir/bin/curl"

          sh -c '. ./mkwork.sh; mkwork__get_latest_tag owner/repo' > /dev/null
          test "$(cat "$CURL_ARGS")" = "-fsSL --connect-timeout 5 --max-time 30 --max-time 10 https://api.github.com/repos/owner/repo/releases/latest"

          : > "$CURL_ARGS"
          sh -c '. ./mkwork.sh; mkwork__download_release owner/repo vTEST "$1"' sh "$tmp_dir/out" > /dev/null 2>&1 || true
          expected="$(printf '%s\n%s' \
            '-fsSL --connect-timeout 5 --max-time 30 https://github.com/owner/repo/releases/download/vTEST/mkwork.sh' \
            '-fsSL --connect-timeout 5 --max-time 30 https://github.com/owner/repo/releases/download/vTEST/mkwork.sh.sha256')"
          test "$(cat "$CURL_ARGS")" = "$expected"

          cat > "$tmp_dir/bin/curl" <<'EOF'
          #!/bin/sh
          printf 'x\n' >> "$CURL_COUNT"
          exit 28
          EOF
          sh -c '. ./mkwork.sh; mkwork__maybe_check_update'
          sh -c '. ./mkwork.sh; mkwork__maybe_check_update'
          grep -q '"last_result": "error"' "$HOME/.local/state/mkwork/state.json"
          test "$(wc -l < "$CURL_COUNT")" -eq 1

      - name: Secure release installation
        run: |
          set -eu
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME/.local/share/mkwork" "$tmp_dir/bin" "$tmp_dir/release"
          printf 'MKWORK_VERSION="vTEST"\n' > "$tmp_dir/release/mkwork.sh"
          (cd "$tmp_dir/release" && sha256sum mkwork.sh > mkwork.sh.sha256)
          cat > "$tmp_dir/bin/curl" <<CURL
          #!/bin/sh
          for url; do :; done
          case "\$url" in
            */releases/latest) printf '{"tag_name":"vTEST"}\n' ;;
            */releases/download/vTEST/*) cat "$tmp_dir/release/\${url##*/}" ;;
            *) exit 1 ;;
          esac
          CURL
          chmod +x "$tmp_dir/bin/curl"
          export PATH="$tmp_dir/bin:$PATH"
          . ./mkwork.sh
          mkwork__is_root() { return 1; }
          installed="$HOME/.local/share/mkwork/mkwork.sh"
          MKWORK_SOURCE_PATH=""
          mkwork__cmd_install --write-config=none
          cmp "$installed" "$tmp_dir/release/mkwork.sh"
          test "$(find "${installed%/*}" -name '.mkwork.*' | wc -l)" -eq 0
          mkwork --update
          cmp "$installed" "$tmp_dir/release/mkwork.sh"
          test "$(find "${installed%/*}" -name '.mkwork.*' | wc -l)" -eq 0
          printf 'sentinel\n' > "$installed"
          (cd "$tmp_dir/release" && sha256sum mkwork.sh | sed 's/  mkwork.sh/  other/' > mkwork.sh.sha256)
          ! mkwork --update
          test "$(cat "$installed")" = sentinel
          test "$(find "${installed%/*}" -name '.mkwork.*' | wc -l)" -eq 0
          rm "$tmp_dir/release/mkwork.sh.sha256"
          ! mkwork --update
          test "$(cat "$installed")" = sentinel
          test "$(find "${installed%/*}" -name '.mkwork.*' | wc -l)" -eq 0

      - name: Install repo override is used for download
        run: |
          set -eu
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME" "$tmp_dir/bin" "$tmp_dir/release"
          printf 'MKWORK_VERSION="vTEST"\n' > "$tmp_dir/release/mkwork.sh"
          (cd "$tmp_dir/release" && sha256sum mkwork.sh > mkwork.sh.sha256)
          cat > "$tmp_dir/bin/curl" <<CURL
          #!/bin/sh
          for url; do :; done
          printf '%s\n' "\$url" >> "$tmp_dir/urls"
          case "\$url" in
            */releases/latest) printf '{"tag_name":"vTEST"}\n' ;;
            */releases/download/vTEST/*) cat "$tmp_dir/release/\${url##*/}" ;;
            *) exit 1 ;;
          esac
          CURL
          chmod +x "$tmp_dir/bin/curl"
          export PATH="$tmp_dir/bin:$PATH"
          . ./mkwork.sh
          mkwork__is_root() { return 1; }
          MKWORK_SOURCE_PATH=""
          mkwork__cmd_install --repo example/custom --write-config=none
          test -s "$tmp_dir/urls"
          test "$(grep -vc 'example/custom' "$tmp_dir/urls" || :)" -eq 0
          test ! -e "$HOME/.config/mkwork/config"
          : > "$tmp_dir/urls"
          mkwork__cmd_install --repo example/custom
          test -s "$tmp_dir/urls"
          test "$(grep -vc 'example/custom' "$tmp_dir/urls" || :)" -eq 0
          grep -q '^repo=example/custom$' "$HOME/.config/mkwork/config"
