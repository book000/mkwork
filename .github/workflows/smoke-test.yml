name: Smoke Test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check
        run: sh -n mkwork.sh

      - name: Smoke test
        run: |
          set -eu
          repo_root="$(pwd)"
          tmp_dir="$(mktemp -d)"
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME"
          . ./mkwork.sh
          mkwork --version
          mkwork --doctor
          mkwork testdir
          test -d "$HOME/work/$(date +%Y%m%d)_testdir"

          # Management commands must keep working for a standalone install
          mkwork --install --repo book000/mkwork
          test -f "$HOME/.local/share/mkwork/mkwork.sh"
          grep -q '^repo=book000/mkwork$' "$HOME/.config/mkwork/config"
          mkwork --uninstall
          test ! -f "$HOME/.local/share/mkwork/mkwork.sh"

          # mise-managed scenario: mimic the bootstrap through the real bash alias/unalias mechanism.
          # Without going through bash alias expansion, a bug in the README bootstrap order would go undetected.
          bash -c '
            set -eu
            shopt -s expand_aliases
            mkwork_sh_path="'"$repo_root"'/mkwork.sh"
            tmp_dir_mise="$(mktemp -d)"
            export HOME="$tmp_dir_mise/home"
            mkdir -p "$HOME"
            alias mkwork="unalias mkwork; export MKWORK_INSTALL_METHOD=mise; . \"$mkwork_sh_path\"; unset MKWORK_INSTALL_METHOD; mkwork"
            mkwork testdir2
            [ -d "$HOME/work/$(date +%Y%m%d)_testdir2" ]
            [ "$MKWORK_MANAGED_BY" = "mise" ]
            mkwork --doctor | grep -q "managed_by: mise"
            ! mkwork --install 2>/tmp/mise-install.err
            grep -q "managed by mise" /tmp/mise-install.err
            ! mkwork --update 2>/tmp/mise-update.err
            grep -q "managed by mise" /tmp/mise-update.err
            ! mkwork --uninstall 2>/tmp/mise-uninstall.err
            grep -q "managed by mise" /tmp/mise-uninstall.err
            [ ! -f "$HOME/.local/state/mkwork/state.json" ]
          '

      - name: Preserve caller variables
        run: |
          set -eu
          tmp_dir="$(mktemp -d)"
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME/.config/mkwork"
          printf 'update_check=0\n' > "$HOME/.config/mkwork/config"
          name=caller_name dir=caller_dir cfg=caller_cfg repo=caller_repo
          unset key line target repo_override
          . ./mkwork.sh
          mkwork --doctor >/dev/null
          mkwork --install --repo invalid >/dev/null 2>&1 || :
          mkwork example
          test "$PWD" = "$HOME/work/$(date +%Y%m%d)_example"
          test "$name:$dir:$cfg:$repo" = caller_name:caller_dir:caller_cfg:caller_repo
          test "${key+x}${line+x}${target+x}${repo_override+x}" = ""

      - name: Auto-update dispatch
        run: |
          set -eu
          tmp_dir="$(mktemp -d)"
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME/.config/mkwork" "$HOME/.local/share/mkwork" "$tmp_dir/bin" "$tmp_dir/release"
          printf 'MKWORK_VERSION="vTEST"\n' > "$tmp_dir/release/mkwork.sh"
          (cd "$tmp_dir/release" && sha256sum mkwork.sh > mkwork.sh.sha256)
          cat > "$tmp_dir/bin/curl" <<EOF
          #!/bin/sh
          for url; do :; done
          case "\$url" in
            */releases/latest) printf '{"tag_name":"vTEST"}\n' ;;
            */releases/download/vTEST/*) cat "$tmp_dir/release/\${url##*/}" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod +x "$tmp_dir/bin/curl"
          export PATH="$tmp_dir/bin:$PATH"
          installed="$HOME/.local/share/mkwork/mkwork.sh"
          state="$HOME/.local/state/mkwork/state.json"
          today="$(date +%Y%m%d)"

          # auto_update=1: the nested call must be --update, not a work name
          printf 'auto_update=1\n' > "$HOME/.config/mkwork/config"
          printf 'placeholder\n' > "$installed"
          timeout -k 2 20 sh -c '. ./mkwork.sh; mkwork autoupd'
          test -d "$HOME/work/${today}_autoupd"
          test ! -d "$HOME/work/${today}_update"
          cmp "$installed" "$tmp_dir/release/mkwork.sh"
          grep -q '"last_auto_update_attempt": "[^"]' "$state"

          # auto_update=0: the notification names a command that exists, and nothing is installed
          rm -f "$state"
          printf 'auto_update=0\n' > "$HOME/.config/mkwork/config"
          printf 'placeholder\n' > "$installed"
          current="$(sh -c '. ./mkwork.sh; printf %s "$MKWORK_VERSION"')"
          sh -c '. ./mkwork.sh; mkwork__maybe_check_update' 2> "$tmp_dir/notify.err"
          test "$(cat "$tmp_dir/notify.err")" = "mkwork: update available ($current -> vTEST). Run: mkwork --update"
          test "$(cat "$installed")" = placeholder
          grep -q '"last_auto_update_attempt": ""' "$state"

      - name: Smoke test (error cases)
        run: |
          set -eu
          tmp_dir="$(mktemp -d)"
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME"
          . ./mkwork.sh

          ! mkwork --unknown 2>/dev/null
          ! mkwork foo --unknown 2>/dev/null
          test ! -d "$HOME/work/$(date +%Y%m%d)_foo"
          ! mkwork -bar 2>/dev/null
          ! mkwork -- -bar 2>/dev/null
          ! mkwork --update extra 2>/dev/null
          ! mkwork --doctor extra 2>/dev/null
          ! mkwork --uninstall extra 2>/dev/null
          ! mkwork --version extra 2>/dev/null
          ! mkwork --help extra 2>/dev/null
          ! mkwork --select extra 2>/dev/null
          ! mkwork --install --repo 2>/dev/null
          ! mkwork --install --unknown 2>/dev/null
          ! mkwork --install bogusarg 2>/dev/null
          ! mkwork --install --repo not-a-valid-repo 2>/dev/null

          mkwork --version
          mkwork --doctor

      - name: Secure release installation
        run: |
          set -eu
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME/.local/share/mkwork" "$tmp_dir/bin" "$tmp_dir/release"
          printf 'MKWORK_VERSION="vTEST"\n' > "$tmp_dir/release/mkwork.sh"
          (cd "$tmp_dir/release" && sha256sum mkwork.sh > mkwork.sh.sha256)
          cat > "$tmp_dir/bin/curl" <<CURL
          #!/bin/sh
          for url; do :; done
          case "\$url" in
            */releases/latest) printf '{"tag_name":"vTEST"}\n' ;;
            */releases/download/vTEST/*) cat "$tmp_dir/release/\${url##*/}" ;;
            *) exit 1 ;;
          esac
          CURL
          chmod +x "$tmp_dir/bin/curl"
          export PATH="$tmp_dir/bin:$PATH"
          . ./mkwork.sh
          mkwork__is_root() { return 1; }
          installed="$HOME/.local/share/mkwork/mkwork.sh"
          MKWORK_SOURCE_PATH=""
          mkwork__cmd_install --write-config=none
          cmp "$installed" "$tmp_dir/release/mkwork.sh"
          test "$(find "${installed%/*}" -name '.mkwork.*' | wc -l)" -eq 0
          mkwork --update
          cmp "$installed" "$tmp_dir/release/mkwork.sh"
          test "$(find "${installed%/*}" -name '.mkwork.*' | wc -l)" -eq 0
          printf 'sentinel\n' > "$installed"
          (cd "$tmp_dir/release" && sha256sum mkwork.sh | sed 's/  mkwork.sh/  other/' > mkwork.sh.sha256)
          ! mkwork --update
          test "$(cat "$installed")" = sentinel
          test "$(find "${installed%/*}" -name '.mkwork.*' | wc -l)" -eq 0
          rm "$tmp_dir/release/mkwork.sh.sha256"
          ! mkwork --update
          test "$(cat "$installed")" = sentinel
          test "$(find "${installed%/*}" -name '.mkwork.*' | wc -l)" -eq 0

      - name: Install repo override is used for download
        run: |
          set -eu
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME" "$tmp_dir/bin" "$tmp_dir/release"
          printf 'MKWORK_VERSION="vTEST"\n' > "$tmp_dir/release/mkwork.sh"
          (cd "$tmp_dir/release" && sha256sum mkwork.sh > mkwork.sh.sha256)
          cat > "$tmp_dir/bin/curl" <<CURL
          #!/bin/sh
          for url; do :; done
          printf '%s\n' "\$url" >> "$tmp_dir/urls"
          case "\$url" in
            */releases/latest) printf '{"tag_name":"vTEST"}\n' ;;
            */releases/download/vTEST/*) cat "$tmp_dir/release/\${url##*/}" ;;
            *) exit 1 ;;
          esac
          CURL
          chmod +x "$tmp_dir/bin/curl"
          export PATH="$tmp_dir/bin:$PATH"
          . ./mkwork.sh
          mkwork__is_root() { return 1; }
          MKWORK_SOURCE_PATH=""
          mkwork__cmd_install --repo example/custom --write-config=none
          test -s "$tmp_dir/urls"
          test "$(grep -vc 'example/custom' "$tmp_dir/urls" || :)" -eq 0
          test ! -e "$HOME/.config/mkwork/config"
          : > "$tmp_dir/urls"
          mkwork__cmd_install --repo example/custom
          test -s "$tmp_dir/urls"
          test "$(grep -vc 'example/custom' "$tmp_dir/urls" || :)" -eq 0
          grep -q '^repo=example/custom$' "$HOME/.config/mkwork/config"
