name: Smoke Test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check
        run: sh -n mkwork.sh

      - name: Smoke test
        run: |
          set -eu
          repo_root="$(pwd)"
          tmp_dir="$(mktemp -d)"
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME"
          . ./mkwork.sh
          mkwork --version
          mkwork --doctor
          mkwork testdir
          test -d "$HOME/work/$(date +%Y%m%d)_testdir"

          # standalone では管理系コマンドが従来どおり動作すること
          mkwork --install --repo book000/mkwork
          test -f "$HOME/.local/share/mkwork/mkwork.sh"
          grep -q '^repo=book000/mkwork$' "$HOME/.config/mkwork/config"
          mkwork --uninstall
          test ! -f "$HOME/.local/share/mkwork/mkwork.sh"

          # mise-managed シナリオ: 実際の bash alias/unalias 機構を経由したブートストラップを模倣する。
          # bash の alias 展開を明示的に経由させないと、README のブートストラップ順序の不具合を検出できない。
          bash -c '
            set -eu
            shopt -s expand_aliases
            mkwork_sh_path="'"$repo_root"'/mkwork.sh"
            tmp_dir_mise="$(mktemp -d)"
            export HOME="$tmp_dir_mise/home"
            mkdir -p "$HOME"
            alias mkwork="unalias mkwork; export MKWORK_INSTALL_METHOD=mise; . \"$mkwork_sh_path\"; unset MKWORK_INSTALL_METHOD; mkwork"
            mkwork testdir2
            [ -d "$HOME/work/$(date +%Y%m%d)_testdir2" ]
            [ "$MKWORK_MANAGED_BY" = "mise" ]
            mkwork --doctor | grep -q "managed_by: mise"
            ! mkwork --install 2>/tmp/mise-install.err
            grep -q "managed by mise" /tmp/mise-install.err
            ! mkwork --update 2>/tmp/mise-update.err
            grep -q "managed by mise" /tmp/mise-update.err
            ! mkwork --uninstall 2>/tmp/mise-uninstall.err
            grep -q "managed by mise" /tmp/mise-uninstall.err
            [ ! -f "$HOME/.local/state/mkwork/state.json" ]
          '

      - name: Smoke test (error cases)
        run: |
          set -eu
          tmp_dir="$(mktemp -d)"
          export HOME="$tmp_dir/home"
          mkdir -p "$HOME"
          . ./mkwork.sh

          ! mkwork --unknown 2>/dev/null
          ! mkwork foo --unknown 2>/dev/null
          test ! -d "$HOME/work/$(date +%Y%m%d)_foo"
          ! mkwork -bar 2>/dev/null
          ! mkwork -- -bar 2>/dev/null
          ! mkwork --update extra 2>/dev/null
          ! mkwork --doctor extra 2>/dev/null
          ! mkwork --uninstall extra 2>/dev/null
          ! mkwork --version extra 2>/dev/null
          ! mkwork --help extra 2>/dev/null
          ! mkwork --select extra 2>/dev/null
          ! mkwork --install --repo 2>/dev/null
          ! mkwork --install --unknown 2>/dev/null
          ! mkwork --install bogusarg 2>/dev/null
          ! mkwork --install --repo not-a-valid-repo 2>/dev/null

          mkwork --version
          mkwork --doctor
